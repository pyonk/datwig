name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Build Environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run Unit Tests
        run: |
          swift test

      - name: Build Application Bundle
        run: |
          mkdir -p build/Release dist

          # 1. Build application bundle
          if xcodebuild clean build \
            -project Datwig.xcodeproj \
            -scheme Datwig \
            -configuration Release \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="./build/Release"; then
            echo "Xcode build succeeded."
            APP_PATH="build/Release/Datwig.app"
          else
            echo "Building via Swift PM fallback..."
            swift build -c release
            BIN_PATH=$(swift build -c release --show-bin-path)
            APP_PATH="build/Release/Datwig.app"
            mkdir -p "$APP_PATH/Contents/MacOS" "$APP_PATH/Contents/Resources"
            cp "$BIN_PATH/Datwig" "$APP_PATH/Contents/MacOS/Datwig"
          fi

          # 2. Ensure bundle metadata & PkgInfo
          cp Sources/Datwig/Info.plist "$APP_PATH/Contents/Info.plist"
          echo -n "APPL????" > "$APP_PATH/Contents/PkgInfo"
          chmod +x "$APP_PATH/Contents/MacOS/Datwig"

          # 3. Apply ad-hoc code signature (required by macOS arm64 gatekeeper)
          codesign --force --deep --sign - \
            --entitlements Sources/Datwig/Datwig.entitlements \
            "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"

          # 4. Package Zip and native DMG
          cd build/Release
          zip -ry "../../dist/Datwig-macOS.zip" Datwig.app
          hdiutil create -volname "Datwig" -srcfolder "Datwig.app" -ov -format UDZO "../../dist/Datwig.dmg"
          cd ../..

          # 5. Generate SHA256 checksums
          cd dist
          shasum -a 256 Datwig-macOS.zip > Datwig-macOS.zip.sha256
          shasum -a 256 Datwig.dmg > Datwig.dmg.sha256
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: Datwig ${{ github.ref_name }}
          files: |
            dist/Datwig.dmg
            dist/Datwig.dmg.sha256
            dist/Datwig-macOS.zip
            dist/Datwig-macOS.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
