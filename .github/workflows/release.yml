name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release macOS App
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Build Environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run Unit Tests
        run: |
          swift test

      - name: Build Application Bundle
        run: |
          mkdir -p build/Release dist

          # Build release target using xcodebuild
          if xcodebuild clean build \
            -project Datwig.xcodeproj \
            -scheme Datwig \
            -configuration Release \
            -destination "generic/platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="./build/Release"; then
            echo "Xcode build succeeded."
            cd build/Release
            zip -ry "../../dist/Datwig-macOS.zip" Datwig.app
            cd ../..
          else
            echo "Falling back to Swift Package Manager build..."
            swift build -c release
            APP_DIR="dist/Datwig.app/Contents"
            mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources"
            cp Sources/Datwig/Info.plist "$APP_DIR/"
            BIN_PATH=$(swift build -c release --show-bin-path)
            cp "$BIN_PATH/Datwig" "$APP_DIR/MacOS/"
            chmod +x "$APP_DIR/MacOS/Datwig"
            cd dist
            zip -ry "Datwig-macOS.zip" Datwig.app
            cd ..
          fi

          # Generate SHA256 checksum
          cd dist
          shasum -a 256 Datwig-macOS.zip > Datwig-macOS.zip.sha256
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: Datwig ${{ github.ref_name }}
          files: |
            dist/Datwig-macOS.zip
            dist/Datwig-macOS.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
